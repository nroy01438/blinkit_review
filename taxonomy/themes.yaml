# Taxonomy nodes that weekly-run themes get mapped to, so themes are
# comparable across runs. New clusters that fit no node are flagged
# status='new' for human triage in /admin rather than auto-filed here.

nodes:
  - id: discovery.search_dependency
    label: "Search-only discovery"
    description: "Users find products almost exclusively via search, not browsing."

  - id: discovery.habit_lock_in
    label: "Habit lock-in / reorder loop"
    description: "Repeat-basket behaviour that crowds out trying new categories."

  - id: barrier.trust
    label: "Trust barriers for new categories"
    description: "Freshness, authenticity, or quality uncertainty blocking first try."

  - id: barrier.information_gap
    label: "Missing pre-purchase information"
    description: "Users lack size/origin/expiry/return info needed to commit to a new SKU."

  - id: barrier.price_perception
    label: "Price perception barrier"
    description: "Belief that unfamiliar categories are priced worse than alternatives."

  - id: ops.delivery_experience
    label: "Delivery/ops experience"
    description: "Delivery time, damage, substitution issues — routed to ops_bucket, excluded from discovery denominators unless also discovery-relevant."

  - id: ops.app_reliability
    label: "App reliability / crashes"
    description: "Non-discovery technical complaints."

  - id: segment.explorer_behaviour
    label: "Explorer segment behaviour"
    description: "Evidence of users actively trying new categories and what enables it."

  - id: competitive.cross_brand
    label: "Cross-brand category problem"
    description: "Theme appears for Blinkit AND competitors — category-level, not Blinkit-specific."
