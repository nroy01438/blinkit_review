# Source registry. Each entry seeds a row in the `sources` table.
# `enabled: false` sources are registered but never fetched by the scheduler —
# flip them on once credentials exist (see .env.example).

sources:
  - name: playstore_blinkit
    kind: playstore
    brand: blinkit
    enabled: true
    config:
      package_name: com.grofers.customerapp
      sort_orders: [NEWEST, MOST_RELEVANT]
      country: in
      lang: en

  - name: appstore_blinkit
    kind: appstore
    brand: blinkit
    enabled: true
    config:
      # Verified 2026-07-28 via App Store search: "Blinkit: Groceries & more",
      # https://apps.apple.com/in/app/blinkit-grocery-in-10-minutes/id960335206
      # The previous id (1085004832) was never confirmed against the live
      # store and did not resolve to the Blinkit listing.
      app_id: "960335206"
      country: in

  - name: reddit
    kind: reddit
    brand: mixed
    enabled: true # code path is real (PRAW, read-only) — still needs REDDIT_CLIENT_ID/SECRET set as env vars
    config:
      subreddits: [india, bangalore, mumbai, delhi, IndianFood, personalfinanceindia, startups]
      query_terms:
        - blinkit
        - zepto
        - instamart
        - quick commerce
        - 10 minute delivery
        - grocery app
      include_comments: true

  - name: forum_crawl
    kind: forum
    brand: mixed
    enabled: true
    config:
      # Verified 2026-07-28 via web search to be real, live pages carrying
      # genuine Blinkit-related consumer discussion (not fabricated) — a
      # consumer-complaints board is the closest fit to "community forum"
      # for a brand with no dedicated public forum of its own. Trafilatura
      # respects robots.txt on fetch; this sandbox's own network policy
      # blocks outbound requests to arbitrary domains, so fetchability
      # from the actual Render deployment could not be verified here —
      # check the "Ingest (live)" result's `per_source.forum_crawl.fetched`
      # count after deploying to confirm these aren't blocked by anti-bot
      # protection, and drop/replace any that return 0.
      seed_urls:
        - https://www.consumercomplaints.in/bycompany/blinkit-a616132.html
      max_pages: 200

  - name: social_csv_import
    kind: social
    brand: mixed
    enabled: true
    config:
      note: "Manual export path only — see /upload. No logged-in scraping."

  - name: marketplace_reviews
    kind: marketplace
    brand: mixed
    enabled: true
    config:
      # Verified 2026-07-28 via web search — MouthShut is a real,
      # independent Indian product/service review site with an existing
      # Blinkit review section (not fabricated). Same fetchability caveat
      # as forum_crawl above applies: verify `per_source.marketplace_reviews`
      # after the first live ingest run on Render.
      seed_urls:
        - https://www.mouthshut.com/product-reviews/blinkit-reviews-925738270
        - https://www.mouthshut.com/product-reviews/blinkit-reviews-925738270-page-2
        - https://www.mouthshut.com/product-reviews/blinkit-reviews-925738270-page-3

  - name: playstore_zepto
    kind: playstore
    brand: zepto
    enabled: true
    config:
      package_name: com.zepto.customer
      sort_orders: [NEWEST, MOST_RELEVANT]
      country: in
      lang: en

  - name: playstore_instamart
    kind: playstore
    brand: instamart
    enabled: true
    config:
      package_name: in.swiggy.android
      sort_orders: [NEWEST, MOST_RELEVANT]
      country: in
      lang: en

  - name: manual_upload
    kind: manual_upload
    brand: mixed
    enabled: true
    config: {}
