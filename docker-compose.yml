services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aisle
      POSTGRES_PASSWORD: aisle
      POSTGRES_DB: aisle_dev
    ports:
      - "5433:5432"
    volumes:
      - aisle_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisle -d aisle_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aisle:aisle@db:5432/aisle_dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aisle_pg_data:
