name: AISLE weekly run

on:
  schedule:
    # Monday 02:00 IST == Sunday 20:30 UTC. GitHub Actions cron uses POSIX
    # syntax (0 = Sunday).
    - cron: "30 20 * * 0"
  workflow_dispatch: {}

jobs:
  weekly:
    runs-on: ubuntu-latest

    # This must run against the REAL deployed database (Supabase), not a
    # throwaway container — a previous version of this workflow spun up its
    # own empty local Postgres service and ran the whole pipeline against
    # that, then deleted it when the job finished. It looked like it worked
    # (green checkmarks every week) but never once touched production, so
    # the live dashboard never saw any of it. DATABASE_URL/GROQ_API_KEY must
    # be repo secrets pointing at the same Supabase/Groq credentials as the
    # Render deployment (Settings -> Secrets and variables -> Actions).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MOCK_MODE: "false"
      MOCK_LLM: "false"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AISLE_MAX_COST_USD: ${{ secrets.AISLE_MAX_COST_USD || '10.00' }}
      AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT || 'ci-run-salt' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Require production secrets
        run: |
          missing=()
          [ -z "$DATABASE_URL" ] && missing+=("DATABASE_URL")
          [ -z "$GROQ_API_KEY" ] && missing+=("GROQ_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}. This workflow only runs against the real production database now — it will not fall back to a throwaway one, since that would silently do nothing useful. Set these under Settings -> Secrets and variables -> Actions, using the same values as the Render deployment."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply schema (idempotent — safe to run against an already-migrated database)
        working-directory: backend
        run: python -m aisle.db.migrate

      - name: Run the weekly job against production
        working-directory: backend
        run: python -m aisle.jobs.weekly --digest-path weekly_digest.md

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisle-weekly-digest-${{ github.run_number }}
          path: backend/weekly_digest.md
